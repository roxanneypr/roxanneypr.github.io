<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffc23d 0%, #ffaa00 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .background-image {
            position: fixed;
            max-width: 300px;
            max-height: 300px;
            object-fit: contain;
            border-radius: 0;
            z-index: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            pointer-events: none;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            color: #ffc23d;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .game-screen {
            display: block;
        }

        .final-screen {
            display: none;
        }

        .word-display {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            min-height: 150px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        .word {
            background: linear-gradient(135deg, #ffc23d 0%, #ffaa00 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-section {
            margin: 20px 0;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ffc23d;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 10px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #ffaa00;
        }

        button {
            background: linear-gradient(135deg, #ffc23d 0%, #ffaa00 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 194, 61, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .info-text {
            color: #666;
            margin: 10px 0;
            font-size: 14px;
        }

        .message {
            font-size: 18px;
            color: #ffc23d;
            margin: 15px 0;
            font-weight: bold;
            min-height: 25px;
        }

        .message.success {
            color: #28a745;
        }

        .message.error {
            color: #dc3545;
        }

        .final-message {
            font-size: 36px;
            color: #ffc23d;
            margin: 30px 0;
            font-weight: bold;
            line-height: 1.5;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .button-container {
            position: relative;
            display: flex;
            flex-direction: row;
            gap: 15px;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            padding: 20px 0;
        }

        .yes-button, .no-button {
            transition: all 0.3s ease;
            width: auto;
            min-width: 120px;
        }

        .yes-button {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
        }

        .no-button {
            background: #6c757d;
        }

        .loading {
            display: none;
            margin: 20px 0;
        }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ffc23d;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            display: none;
            font-size: 24px;
            color: #28a745;
            margin: 20px 0;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 20px;
            }

            .word {
                font-size: 14px;
                padding: 8px 16px;
            }

            .final-message {
                font-size: 28px;
            }

            input, button {
                font-size: 14px;
            }

            .background-image {
                max-width: 120px;
                max-height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-screen">
            <h1>💕 Guess the Message 💕</h1>
            <p class="info-text">Words revealed: <span id="wordCount">0</span>/10</p>
            <div class="word-display" id="wordDisplay"></div>
            <div class="message" id="message"></div>
            <div class="input-section">
                <input type="text" id="guessInput" placeholder="Guess a word..." autocomplete="off">
                <button onclick="makeGuess()">Submit Guess</button>
            </div>
        </div>

        <div class="final-screen" id="finalScreen">
            <div class="final-message">
                Will You Be<br>My Valentine? 💕
            </div>
            <div class="button-container" id="buttonContainer">
                <button class="yes-button" id="yesButton" onclick="handleYes()">Yes! 💕</button>
                <button class="no-button" id="noButton" onclick="handleNo()">No</button>
            </div>
            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <p>Sending notification...</p>
            </div>
            <div class="success-message" id="successMessage">
                🎉 Yay Baguio date! I love you! 🎉
            </div>
        </div>
    </div>

    <script>
        const words = ["love", "gab", "14", "forever", "us", "cold", "chill", "foods", "together", "rest"];
        const targetPhrase = ["will", "you", "be", "my", "valentine"];
        let revealedWords = [];
        let currentWordIndex = 0;
        let guessedCorrectly = new Set();
        let noClickCount = 0;

        // Array of image filenames
        const images = [
            'IMG_2611.jpg',
            '2.jpg',
            'IMG_3449.JPG',
            'IMG_4481.jpg',
            'IMG_4622.PNG',
            'IMG_5375.JPG',
            'IMG_5990.JPG',
            'IMG_7363.JPG'
        ];

        // Create random background images
        function createBackgroundImages() {
            const body = document.body;
            const container = document.querySelector('.container');
            const isMobile = window.innerWidth <= 480;
            const imageSize = isMobile ? 120 : 300;
            const padding = isMobile ? 10 : 50;

            // Get container boundaries
            const containerRect = container.getBoundingClientRect();
            const exclusionZone = {
                left: containerRect.left - 50,
                right: containerRect.right + 50,
                top: containerRect.top - 50,
                bottom: containerRect.bottom + 50
            };

            // Create a grid-like distribution
            const positions = [];
            const cols = isMobile ? 2 : 3;
            const rows = isMobile ? 4 : 3;

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    const randomOffset = isMobile ? 30 : 100;
                    const x = (window.innerWidth / cols) * i + Math.random() * randomOffset;
                    const y = (window.innerHeight / rows) * j + Math.random() * randomOffset;

                    // Check if position overlaps with container
                    if (x + imageSize < exclusionZone.left ||
                        x > exclusionZone.right ||
                        y + imageSize < exclusionZone.top ||
                        y > exclusionZone.bottom) {
                        positions.push({ x, y });
                    }
                }
            }

            // Shuffle positions
            positions.sort(() => Math.random() - 0.5);

            images.forEach((imageSrc, index) => {
                if (index >= positions.length) return;

                const img = document.createElement('img');
                img.src = `images/${imageSrc}`;
                img.className = 'background-image';

                const pos = positions[index];
                img.style.left = `${Math.max(padding, Math.min(pos.x, window.innerWidth - imageSize - padding))}px`;
                img.style.top = `${Math.max(padding, Math.min(pos.y, window.innerHeight - imageSize - padding))}px`;

                body.insertBefore(img, body.firstChild);
            });
        }

        // Reveal first word on load
        window.onload = function() {
            //createBackgroundImages();
            revealNextWord();
        };

        function revealNextWord() {
            if (currentWordIndex < words.length) {
                revealedWords.push(words[currentWordIndex]);
                currentWordIndex++;
                updateDisplay();
            }
        }

        function updateDisplay() {
            const wordDisplay = document.getElementById('wordDisplay');
            wordDisplay.innerHTML = '';

            revealedWords.forEach(word => {
                const wordSpan = document.createElement('span');
                wordSpan.className = 'word';
                wordSpan.textContent = word;
                wordDisplay.appendChild(wordSpan);
            });

            document.getElementById('wordCount').textContent = revealedWords.length;
        }

        function makeGuess() {
            const input = document.getElementById('guessInput');
            const guess = input.value.trim().toLowerCase();
            const messageEl = document.getElementById('message');

            if (!guess) {
                messageEl.textContent = 'Please enter a word!';
                messageEl.className = 'message error';
                return;
            }

            if (targetPhrase.includes(guess)) {
                if (guessedCorrectly.has(guess)) {
                    messageEl.textContent = `You already guessed "${guess}"!`;
                    messageEl.className = 'message';
                } else {
                    guessedCorrectly.add(guess);
                    messageEl.textContent = `Correct! "${guess}" is part of the message! (${guessedCorrectly.size}/5)`;
                    messageEl.className = 'message success';

                    if (guessedCorrectly.size === 5) {
                        setTimeout(showFinalScreen, 1500);
                    } else {
                        revealNextWord();
                    }
                }
            } else {
                messageEl.textContent = `"${guess}" is not part of the message. Try again!`;
                messageEl.className = 'message error';

                if (currentWordIndex < words.length) {
                    revealNextWord();
                } else {
                    // All words revealed, show final screen
                    setTimeout(showFinalScreen, 2000);
                }
            }

            input.value = '';
        }

        // Allow Enter key to submit
        document.getElementById('guessInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                makeGuess();
            }
        });

        function showFinalScreen() {
            document.querySelector('.game-screen').style.display = 'none';
            document.getElementById('finalScreen').style.display = 'block';
        }

        function handleYes() {
            const loading = document.getElementById('loading');
            const successMessage = document.getElementById('successMessage');
            const buttonContainer = document.getElementById('buttonContainer');

            buttonContainer.style.display = 'none';
            loading.style.display = 'block';

            // Send email notification using a simple email service
            sendEmail().then(() => {
                loading.style.display = 'none';
                successMessage.style.display = 'block';
            }).catch(() => {
                loading.style.display = 'none';
                successMessage.style.display = 'block';
            });
        }

        function handleNo() {
            noClickCount++;
            const yesButton = document.getElementById('yesButton');
            const noButton = document.getElementById('noButton');
            const container = document.getElementById('buttonContainer');

            // Make No button absolutely positioned on first click
            if (noClickCount === 1) {
                noButton.style.position = 'absolute';
            }

            // Make Yes button bigger
            const currentSize = 15 + (noClickCount * 5);
            yesButton.style.padding = `${currentSize}px ${currentSize * 2}px`;
            yesButton.style.fontSize = `${16 + noClickCount * 2}px`;

            // Move No button to random position
            const containerWidth = container.offsetWidth;
            const containerHeight = container.offsetHeight;
            const buttonWidth = noButton.offsetWidth;
            const buttonHeight = noButton.offsetHeight;

            const maxX = containerWidth - buttonWidth - 40;
            const maxY = containerHeight - buttonHeight - 40;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            noButton.style.left = `${randomX}px`;
            noButton.style.top = `${randomY}px`;
        }

        async function sendEmail() {
            try {
                // Using Web3Forms - a free form backend service
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        access_key: '8e4b4e9a-7c3d-4f8a-9b2e-1d5c6a7b8c9d', // You'll need to replace this with your own key from web3forms.com
                        subject: 'She said YES! 💕',
                        from_name: 'Valentine Game',
                        message: 'Gab said YES to being your Valentine! 💕🎉',
                        email: 'resuellorox@gmail.com'
                    })
                });

                const result = await response.json();
                console.log('Email sent:', result);
                return true;
            } catch (error) {
                console.error('Email error:', error);
                // Fallback: try to send via FormSubmit
                try {
                    await fetch('https://formsubmit.co/ajax/resuellorox@gmail.com', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            subject: 'She said YES! 💕',
                            message: 'Gab said YES to being your Valentine! 💕🎉',
                            _captcha: 'false'
                        })
                    });
                } catch (e) {
                    console.error('Fallback email error:', e);
                }
                return true; // Still show success to the user
            }
        }
    </script>
</body>
</html>
